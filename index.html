uch time has passed."},{id:"personality",variant:"personality",icon:"sparkle",heading:"Your personality.",text:"I love the way you carry yourself, the way you express yourself, and how you can make even the most ordinary moments feel a little more interesting."},{id:"playful-fraa",variant:"playful",icon:"playful",tag:"never change this ♡",text:"I love how playful you are. How you can be so effortlessly silly, how you tease, joke around and the way you Dey always fraa. I hope you never stop being that girl who finds joy in the little things."},{id:"little-habits",variant:"keepsake",text:"The little things you do, your little habits and all those random moments that might seem insignificant to you —",highlight:"I notice them. And somehow, they’ve all become things I find myself appreciating about you."}]},polaroids:{title:[{text:"Little daydreams"},{text:"of us.",em:!0}],subtitle:"Tap any Polaroid to flip it over ✨",cards:[{id:"p1",src:"",tone:"sunrise",caption:"morning sunshine, aka you",backNote:"Waking up and immediately smiling because your name popped into my head first.",tilt:-3.5},{id:"p2",src:"",tone:"amber-eyes",caption:"warmest light brown eyes",backNote:"Honestly unfair how pretty your eyes are. Time genuinely stops a little.",tilt:2.8},{id:"p3",src:"",tone:"playful",caption:"when you dey fraa 😂♡",backNote:"Even when you’re teasing or doing the absolute most, you’re still my favourite person.",tilt:-2.2},{id:"p4",src:"",tone:"moonlight",caption:"after “goodnighttt”",backNote:"Saying goodnighttt and still replaying our conversations in my head.",tilt:3.4},{id:"p5",src:"",tone:"bloom",caption:"flowers for my girl",backNote:"Because someone as soft, sweet, and special as you deserves every pretty thing.",tilt:-2.8},{id:"p6",src:"",tone:"future",caption:"saving space for our memories",backNote:"For all the random days, laughs, dates, and memories we haven’t even made yet ♡",tilt:2.1}]},scratchSecret:{eyebrow:"TINY SECRET BEFORE THE LETTER",prompt:"Scratch the pastel shimmer with your finger or mouse ✨",hiddenNote:"Smiling at my phone because of you has quietly become my favourite part of every single day.",hiddenSign:"— Niyi ♡"},letter:{kicker:"from my heart to yours",salutation:"My dearest Faridaa,",paragraphs:["I’ve been thinking about how to say this in a way that feels right, and I realised that maybe there isn’t a perfect way to say something that genuinely matters.","You’re more special to me than you’ll ever be able to understand, my love. Sometimes I try to find the perfect words to explain what you mean to me, but somehow every word still feels too small. You’ve become such a beautiful and important part of my life that I honestly can’t imagine my days feeling the same without you. You’re not just someone who’s in my life, you’ve become someone who’s deeply connected to my heart. Before you, I never imagined that one person could become this important to me. Somehow, you slowly became a part of everything. You’re the first person I want to tell when something makes me happy, the person I think about when I’m having a difficult day, and the person my heart naturally searches for without me even realizing it. I hope you always remember how much you matter to me.","You are appreciated in ways you probably don’t even notice. I love your heart, your personality, your kindness, your way of thinking, and all those tiny details that make you who you are. Even the things you may see as flaws are things I would never want to change about you. Your happiness will always mean something to me. I find myself thinking about whether you’re okay, whether you’ve eaten, whether you’re tired, or whether something is bothering you. Not because I’m obligated to care, but because caring about you has become something that comes naturally to me.","Thank you for every moment you’ve shared with me, every smile, every laugh, every conversation, and every memory we made together. Whether you realize it or not, you’ve brought so much happiness into my life and changed me in ways I’ll always be grateful for. You’ve shown me how beautiful it can be to genuinely care about someone and love them with your whole heart.","If there’s one thing I want you to always remember, it’s this, you’ll never be “just another person” to me. You’ll always be someone special, someone I could never replace. No matter where life takes us, you’ll always have a place in my heart that belongs only to you. Because the truth is, you’re not simply important to me. You’re someone I genuinely cherish, someone whose happiness matters to me, and someone I’ll always be thankful for. I love you more than I could ever explain through words, and I hope you never forget how deeply you are loved, valued, and cherished by me."],postscript:"And now, there’s one thing I’ve been wanting to ask you...",closing:"With all my heart,",signature:"Niyi ♡"},buildup:{first:"So...",second:"Faridaa, I have a question for you.",button:"Okay, ask me ♡"},proposal:{to:"Faridaa,",question:["Will you be","my girlfriend?"],support:"I’d really love to call you mine and make something unforgettable with you.",yes:"Yes, Niyi ♡",no:"No I don’t want to",ragebait:{lines:["no ragebait me !","No ragebait mee !!","NO RAGEBAIT MEE !!!"],sub:"Faridaa abeg stop playing with my heart right now 😭🫵",backButton:"Okay okay, take me back 😂",yesButton:"I was joking — Yes, Niyi! ♡"},yesMoment:{badge:"OFFICIAL ♡",first:"wait... you said YES?! ♡",second:"Faridaa, you just made me smile more than you’ll ever know.",third:"Here’s to us — to every morning sun, every late “goodnighttt”, all your playful moments, and every beautiful chapter ahead of us.",signature:"Forever yours, Niyi ♡",showerHearts:"Send more hearts ♡",replay:"Replay the question",toLetter:"Read your letter again"}},footer:{line:"Made just for Faridaa, with all my heart.",copyright:"♡ Niyi",restart:"Start from the envelope again"}};function lS(){const[n,r]=D.useState(!1),s=D.useRef(null),a=D.useRef(null),u=D.useRef(null
